<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Better Botolan</title>
    <meta name="theme-color" content="#2563eb" />
    <style>
      :root {
        --blue: #2563eb;
        --ink: #0f172a;
        --muted: #64748b;
        --bg: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      img { width: 84px; height: 84px; }
      h1 { font-size: 1.4rem; margin: 18px 0 6px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
      .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      a.btn, button.btn {
        display: inline-block;
        text-decoration: none;
        border: 0;
        cursor: pointer;
        border-radius: 999px;
        padding: 11px 20px;
        font-size: 0.95rem;
        font-weight: 600;
      }
      .primary { background: var(--blue); color: #fff; }
      .ghost { background: #fff; color: var(--ink); border: 1px solid #e2e8f0; }
      small { display: block; margin-top: 22px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Better Botolan" />
      <h1>You're offline</h1>
      <p>
        This page needs a connection and couldn't load. Pages you've opened
        before — including hotlines and disaster preparedness — may still work.
      </p>
      <div class="row">
        <button class="btn primary" onclick="location.reload()">Try again</button>
        <a class="btn ghost" href="/hotlines">Emergency hotlines</a>
      </div>
      <small>Municipality of Botolan, Zambales · Better Botolan</small>
    </div>
  </body>
</html>
