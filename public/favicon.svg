    <!-- sea -->
    <rect x="0" y="44" width="64" height="22" fill="#7A0A1C"/>
    <path d="M0 47.5 Q4 45 8 47.5 T16 47.5 T24 47.5 T32 47.5 T40 47.5 T48 47.5 T56 47.5 T64 47.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".55"/>
    <path d="M0 53.5 Q4 51 8 53.5 T16 53.5 T24 53.5 T32 53.5 T40 53.5 T48 53.5 T56 53.5 T64 53.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".35"/>
    <!-- sailboat (the red sail of the municipal seal, inverted for contrast) -->
    <path d="M33.5 35 L33.5 48.5 L25.5 48.5 Z" fill="#FFFFFF"/>
    <path d="M24 49.5 H42 L38.5 53.5 H27.5 Z" fill="#C8102E"/>
